name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flet CLI
        run: pip install flet==1.1.3

      - name: Build APK
        # First build downloads the Flutter SDK (~15 min) — that's expected.
        # flet-audio is picked up from pyproject dependencies; there is no
        # --include-packages flag in Flet 1.1.3, so don't add one.
        run: flet build apk --yes --no-rich-output --python-version 3.12

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rude-awakening-apk
          path: build/apk/*.apk
          if-no-files-found: error
