name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Install Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          curl -sL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip
          mv cmdline-tools latest
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Kotlin compiler
        # Unzip into /tmp first: unzipping in $HOME then `mv kotlinc $HOME/kotlinc`
        # fails with "cannot move 'kotlinc' to a subdirectory of itself".
        run: |
          mkdir -p /tmp/kotlinc-dl
          cd /tmp/kotlinc-dl
          curl -sL -o kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.24/kotlin-compiler-1.9.24.zip
          unzip -q kotlin.zip
          mv kotlinc $HOME/kotlinc

      - name: Build APK (manual aapt2 + kotlinc + d8)
        # NOTE: $HOME must be expanded by the shell here. Putting it in the
        # env: mapping passes the literal string "$HOME/android-sdk", and the
        # script then looks for a directory literally named $HOME (exit 127).
        run: |
          chmod +x manual-build.sh
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          export KOTLINC_BIN="$HOME/kotlinc/bin/kotlinc"
          export KOTLIN_STDLIB="$HOME/kotlinc/lib/kotlin-stdlib.jar"
          ./manual-build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rude-awakening-apk
          path: rude-awakening-native-v7.apk
          retention-days: 30
